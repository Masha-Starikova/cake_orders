# Проект подключается к общей docker-сети "web", где его видит Caddy
# из ~/proxy (см. docs-deploy-vps.md). Портов наружу не открывает.
# Сеть создаётся один раз на сервере: docker network create web
services:
  app:
    build: .
    container_name: cake_orders-app
    env_file: .env
    restart: unless-stopped
    networks: [web]
    # Docker сам видит зависшее приложение и перезапускает контейнер.
    # В образе нет curl, поэтому проверяем средствами Node.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # С некоторых российских сетей часть адресов api.telegram.org недоступна,
    # а DNS отдаёт именно их. Закрепляем рабочий адрес; переопределяется
    # переменной TELEGRAM_API_IP в .env.
    extra_hosts:
      - "api.telegram.org:${TELEGRAM_API_IP:-149.154.167.220}"

networks:
  web:
    external: true
