# Автодеплой: push в main → тесты → код по SSH на сервер → пересборка
# контейнера → проверка, что сайт отвечает. Если новая версия не поднялась,
# возвращаем предыдущий образ, чтобы сайт не остался лежать.
#
# Секреты репозитория:
#   SSH_HOST — IP сервера (135.106.197.121)
#   SSH_KEY  — приватный ключ деплоя (содержимое ~/.ssh/cake_deploy)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_DIR: apps/cake_orders
  CONTAINER: cake_orders-app
  SITE: https://thecakeclub.ru

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Tests
        run: npm test

      # Шаг намеренно многословен: без него пустой или неверный секрет даёт
      # невнятную ошибку ssh-keyscan, и непонятно, что чинить.
      - name: SSH key
        run: |
          # Проверяем оба секрета сразу и только потом выходим: иначе про
          # второй недостающий узнаёшь лишь на следующем запуске.
          missing=0
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "::error::Секрет SSH_HOST не задан. Settings → Secrets and variables → Actions → New repository secret. Имя SSH_HOST, значение 135.106.197.121"
            missing=1
          fi
          if [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "::error::Секрет SSH_KEY не задан. Имя SSH_KEY, значение — приватный ключ целиком: pbcopy < ~/.ssh/cake_deploy"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy

          if ! grep -q "PRIVATE KEY" ~/.ssh/deploy; then
            echo "::error::SSH_KEY не похож на приватный ключ. Нужен файл ~/.ssh/cake_deploy целиком, вместе со строками BEGIN и END, а не ~/.ssh/cake_deploy.pub"
            exit 1
          fi
          if ! ssh-keygen -y -f ~/.ssh/deploy > /dev/null 2>&1; then
            echo "::error::SSH_KEY повреждён: OpenSSH не читает его. Скопируйте файл заново целиком, без лишних пробелов и переносов."
            exit 1
          fi

          if ! ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "::error::Сервер ${{ secrets.SSH_HOST }} не отвечает на порту 22. Проверьте, что он включён, и что firewall не закрыл SSH."
            exit 1
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Сервер ${{ secrets.SSH_HOST }} не отдал ключ хоста. Похоже, SSH на нём не слушает."
            exit 1
          fi

      - name: Check connection
        run: |
          if ! ssh -i ~/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=20 \
                 deploy@${{ secrets.SSH_HOST }} 'echo соединение установлено'; then
            echo "::error::Не удалось войти на сервер как deploy. Публичная часть ключа должна лежать в /home/deploy/.ssh/authorized_keys"
            exit 1
          fi

      # Сервер 1 vCPU / 2 ГБ. Без swap сборка Next.js не проходит и
      # OOM-killer уносит вместе с ней работающий сайт. Лучше остановиться
      # здесь с понятной ошибкой, чем уронить прод.
      - name: Preflight (swap, место на диске)
        run: |
          ssh -i ~/.ssh/deploy deploy@${{ secrets.SSH_HOST }} 'bash -s' <<'REMOTE'
          set -e
          echo "--- память ---"; free -m
          echo "--- диск ---";   df -h /

          if [ "$(swapon --show --noheadings | wc -l)" -eq 0 ]; then
            echo "::error::На сервере нет swap. Сборка на 2 ГБ упадёт по памяти."
            echo "Включить: sudo fallocate -l 2G /swapfile && sudo chmod 600 /swapfile \\"
            echo "          && sudo mkswap /swapfile && sudo swapon /swapfile"
            exit 1
          fi

          FREE_MB=$(df -m / | awk 'NR==2 {print $4}')
          if [ "$FREE_MB" -lt 3000 ]; then
            echo "::error::На диске меньше 3 ГБ свободно ($FREE_MB МБ). Docker не соберёт образ."
            echo "Очистить: docker system prune -af"
            exit 1
          fi
          REMOTE

      - name: Upload code
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy" \
            --exclude node_modules --exclude .next --exclude .git \
            --exclude '.env*' --exclude .github \
            ./ deploy@${{ secrets.SSH_HOST }}:~/${{ env.APP_DIR }}/

      # Сборка отдельным шагом: пока она идёт, старый контейнер продолжает
      # обслуживать сайт. Контейнер переключаем только на удачный образ.
      - name: Build image
        run: |
          ssh -i ~/.ssh/deploy deploy@${{ secrets.SSH_HOST }} \
            "cd ~/${{ env.APP_DIR }} && docker compose build"

      - name: Restart and verify
        run: |
          ssh -i ~/.ssh/deploy deploy@${{ secrets.SSH_HOST }} 'bash -s' <<'REMOTE'
          set -e
          cd ~/apps/cake_orders

          # Запоминаем работающую версию: id образа и имя тега, под которым
          # его ищет compose. По ним можно вернуться, если новая версия упадёт.
          PREV_ID=$(docker inspect --format '{{.Image}}' cake_orders-app 2>/dev/null || echo "")
          PREV_TAG=$(docker inspect --format '{{.Config.Image}}' cake_orders-app 2>/dev/null || echo "")
          echo "Предыдущий образ: ${PREV_ID:-нет, первый запуск} (${PREV_TAG:-—})"

          docker compose up -d

          # Ждём, пока приложение начнёт отвечать: до 60 секунд.
          ok=0
          for i in $(seq 1 20); do
            if docker exec cake_orders-app node -e \
                 "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
                 2>/dev/null; then
              ok=1; echo "Приложение ответило с попытки $i"; break
            fi
            sleep 3
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::Новая версия не поднялась. Логи контейнера:"
            docker logs --tail 80 cake_orders-app 2>&1 || true
            if [ -n "$PREV_ID" ] && [ -n "$PREV_TAG" ]; then
              echo "Откатываюсь на предыдущий образ."
              # Возвращаем старый образ под тем же тегом и поднимаем контейнер
              # обычным compose: сеть, .env и extra_hosts применятся как всегда.
              docker tag "$PREV_ID" "$PREV_TAG"
              docker compose up -d --force-recreate
              echo "Откат выполнен: сайт работает на прежней версии."
            else
              echo "Откатываться не на что: предыдущего образа нет."
            fi
            exit 1
          fi

          docker image prune -f
          REMOTE

      # Проверка снаружи, через домен и Caddy: именно так сайт видят люди.
      - name: Smoke test
        run: |
          code=$(curl -sS -o /dev/null --max-time 30 -w '%{http_code}' "${{ env.SITE }}/")
          echo "Главная страница ответила: $code"
          if [ "$code" != "200" ]; then
            echo "::error::Сайт отвечает $code вместо 200"
            exit 1
          fi
          api=$(curl -sS -o /dev/null --max-time 30 -w '%{http_code}' "${{ env.SITE }}/api/blocked-dates")
          echo "API закрытых дат ответило: $api"
          if [ "$api" != "200" ]; then
            echo "::error::API отвечает $api вместо 200"
            exit 1
          fi
